[project]
name = "lancedb-bench"
version = "0.1.0"
description = "LanceDB vector database benchmark and CLI suite"
readme = "README.md"
# TODO fill out
authors = []
requires-python = ">=3.12"

# Client side (benchmark client container): no database engine in here on purpose
dependencies = [
    "numpy==2.4.4",
    "pyarrow==26.0.0",
    "httpx>=0.28.1",
    "psutil==7.2.2",
    "huggingface-hub>=0.26.0",
]

[project.optional-dependencies]
# Database side (db container): LanceDB engine plus the HTTP wrapper
db = [
    "lancedb==0.40.0",
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.3",
]

[project.scripts]
db = "lancedb_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lancedb_bench"]
